name: Fix Build APK Final
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean all bad icon files and fix build
        run: |
          echo "=== BEFORE ==="
          find app/src/main/res -name "*ic_launcher*" -type f 2>/dev/null || true
          # Delete ALL bad files
          rm -f app/src/main/res/drawable/ic_launcher.png
          rm -f app/src/main/res/drawable/ic_launcher.xml
          rm -f app/src/main/res/drawable/ic_launcher_round.xml
          rm -f "app/src/main/res/drawable/ic_launcher (1).png"
          rm -f app/src/main/res/drawable/ic_pijatin_logo.xml
          rm -rf app/src/main/res/mipmap-hdpi
          rm -rf app/src/main/res/mipmap-mdpi
          rm -rf app/src/main/res/mipmap-xhdpi
          rm -rf app/src/main/res/mipmap-xxhdpi
          rm -rf app/src/main/res/mipmap-xxxhdpi
          # Recreate from already committed icon (the gold one)
          # If mipmap-xxxhdpi was deleted, we need to restore from last good icon commit
          # Use the icon that #3 just pushed - find it in git
          git log --oneline -5
          # Ensure mipmap folders exist
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          # Copy from xxxhdpi if exists, else we will use the 192 icon we know works
          if [ -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            echo "Found existing icon, copying..."
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          else
            echo "No icon found, will be restored by Add Icon workflow, skipping"
          fi
          # Fix AndroidManifest - FORCE to mipmap
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/@drawable\/ic_launcher/@mipmap\/ic_launcher/g' app/src/main/AndroidManifest.xml
            sed -i 's/@drawable\/ic_launcher_round/@mipmap\/ic_launcher/g' app/src/main/AndroidManifest.xml
            sed -i 's/@mipmap\/ic_launcher_round/@mipmap\/ic_launcher/g' app/src/main/AndroidManifest.xml
            echo "=== MANIFEST ==="
            grep -n "ic_launcher" app/src/main/AndroidManifest.xml || true
          fi
          echo "=== AFTER ==="
          find app/src/main/res -name "*ic_launcher*" -type f
          ls -lh app/src/main/res/mipmap-*/ic_launcher.png 2>/dev/null || echo "mipmap not yet exists, need run Add Icon again"
          git config user.name "violet"
          git config user.email "violet@users.noreply.github.com"
          git add -A
          git commit -m "Fix build: clean bad drawables, force mipmap icon #96" || echo "no changes"
          git push origin main
