name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Clean bad drawables
        run: |
          rm -f app/src/main/res/drawable/ic_launcher.png || true
          rm -f app/src/main/res/drawable/ic_launcher.xml || true
          rm -f app/src/main/res/drawable/ic_launcher_round.xml || true
          rm -f "app/src/main/res/drawable/ic_launcher (1).png" || true
          rm -rf app/src/main/res/mipmap-anydpi-v26 || true
          echo "Current icons:"
          ls -lh app/src/main/res/mipmap-xxxhdpi/ | head -10
      - name: Build Debug APK
        run: ./gradlew app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PijatIN-Customer-GOLD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
