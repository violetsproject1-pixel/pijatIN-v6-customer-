name: Add PijatIN Gold Icon
on: workflow_dispatch
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${ secrets.GITHUB_TOKEN }
      - name: Add icon from uploaded image
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          echo "" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "" | base64 -d > app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          # also create smaller via convert if imagemagick available, else copy
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          # Fix AndroidManifest to use mipmap
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/@drawable\/ic_launcher/@mipmap\/ic_launcher/g' app/src/main/AndroidManifest.xml
            sed -i 's/@drawable\/ic_launcher_round/@mipmap\/ic_launcher_round/g' app/src/main/AndroidManifest.xml
            sed -i 's/@mipmap\/ic_launcher_round/@mipmap\/ic_launcher/g' app/src/main/AndroidManifest.xml || true
            cat app/src/main/AndroidManifest.xml | grep -A2 -B2 ic_launcher || true
          fi
          # Remove conflicting drawable files
          rm -f app/src/main/res/drawable/ic_launcher.png
          rm -f app/src/main/res/drawable/ic_launcher.xml
          rm -f "app/src/main/res/drawable/ic_launcher (1).png"
          rm -f app/src/main/res/drawable/ic_pijatin_logo.xml
          ls -lh app/src/main/res/mipmap-*/ic_launcher.png
          git config user.name "violet"
          git config user.email "violet@users.noreply.github.com"
          git add -A
          git commit -m "Add PijatIN gold lotus icon from user upload #96" || echo "no changes"
          git push origin main
