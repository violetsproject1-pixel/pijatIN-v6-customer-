name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore all wrapper files
        run: |
          rm -rf gradle
          mkdir -p gradle/wrapper
          curl -Ls https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
          curl -Ls https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -Ls https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ls -lh gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: ./gradlew app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PijatIN-GOLD-APK-113
          path: app/build/outputs/apk/debug/*.apk
