name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RESTORE GRADLEW + JAR OFFICIAL (bypass wrapper task)
        run: |
          echo "=== BEFORE ==="
          ls -lh gradlew gradle/wrapper/ || true
          wc -c gradlew gradle/wrapper/gradle-wrapper.jar 2>&1 || true
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          echo "Downloading official gradlew..."
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties || true
          chmod +x gradlew
          echo "=== AFTER ==="
          ls -lh gradlew gradle/wrapper/
          head -5 gradlew

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Build REAL APK 4m
        run: ./gradlew app:assembleDebug --stacktrace --no-daemon

      - name: Find APKs
        if: always()
        run: find . -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload GOLD APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PijatIN-GOLD-APK-110-FINAL
          path: app/build/outputs/apk/debug/*.apk
