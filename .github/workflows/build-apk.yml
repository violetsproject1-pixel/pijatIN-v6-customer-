name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix gradlew jar is directory
        run: |
          rm -rf gradlew gradle/wrapper
          mkdir -p gradle/wrapper
          curl -Ls https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
          curl -Ls https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls -lh gradlew gradle/wrapper/gradle-wrapper.jar
          echo "Fixed OK"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PijatIN-GOLD-APK-112
          path: app/build/outputs/apk/debug/*.apk
