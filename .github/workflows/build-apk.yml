name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix icon (1) with Python - SAFE
        run: |
          python3 << 'PY'
          import os, re, pathlib
          root = pathlib.Path("app/src/main/res")
          print("Before:")
          for p in root.rglob("*ic_launcher*"):
              print(p)
          # Rename files containing ( ) 
          for p in list(root.rglob("*")):
              if p.is_file() and "(" in p.name:
                  new_name = p.name.replace("(1)","").replace("(2)","").replace("(3)","").replace(" ","")
                  new_path = p.parent / new_name
                  print(f"Rename {p} -> {new_path}")
                  if not new_path.exists():
                      p.rename(new_path)
                  else:
                      p.unlink()
          # Fix manifest
          man = pathlib.Path("app/src/main/AndroidManifest.xml")
          if man.exists():
              txt = man.read_text()
              txt_new = txt.replace("ic_launcher(1)", "ic_launcher").replace("ic_launcher_round(1)", "ic_launcher_round").replace("(1)","")
              if txt != txt_new:
                  print("Fixing AndroidManifest.xml")
                  man.write_text(txt_new)
          print("After:")
          for p in root.rglob("*ic_launcher*"):
              print(p)
          # Restore gradlew
          import urllib.request, os
          os.makedirs("gradle/wrapper", exist_ok=True)
          def dl(url, dst):
              print(f"DL {url} -> {dst}")
              try:
                  urllib.request.urlretrieve(url, dst)
              except Exception as e:
                  print(e)
          # Remove bad jar if is directory
          jar_path = pathlib.Path("gradle/wrapper/gradle-wrapper.jar")
          if jar_path.is_dir():
              import shutil
              shutil.rmtree(jar_path)
          if jar_path.exists():
              jar_path.unlink()
          dl("https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradlew", "gradlew")
          dl("https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar", "gradle/wrapper/gradle-wrapper.jar")
          Path = pathlib.Path
          Path("gradle/wrapper/gradle-wrapper.properties").write_text("distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip\nnetworkTimeout=10000\nvalidateDistributionUrl=true\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n")
          os.chmod("gradlew", 0o755)
          PY
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Local props
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build APK
        run: ./gradlew app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PijatIN-GOLD-APK-119-FIXED
          path: app/build/outputs/apk/debug/*.apk
