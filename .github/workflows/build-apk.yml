name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Clean bad drawables (keep GOLD icon)
        run: |
          rm -f app/src/main/res/drawable/ic_launcher.png || true
          rm -f app/src/main/res/drawable/ic_launcher.xml || true
          rm -f app/src/main/res/drawable/ic_launcher_round.xml || true
          rm -f "app/src/main/res/drawable/ic_launcher (1).png" || true
          rm -rf app/src/main/res/mipmap-anydpi-v26 || true
          echo "ICON GOLD CHECK:"
          ls -lh app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || echo "ICON MISSING!"
          ls -lh app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true

      - name: Build Debug APK
        run: ./gradlew app:assembleDebug --stacktrace --no-daemon

      - name: List APK outputs
        if: always()
        run: find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK GOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PijatIN-Customer-GOLD-APK-103-FINAL
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
