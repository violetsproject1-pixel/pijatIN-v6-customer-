name: Add PijatIN Gold Icon
on: workflow_dispatch
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          echo "" | base64 -d > /tmp/icon.png
          cp /tmp/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp /tmp/icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp /tmp/icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp /tmp/icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp /tmp/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp /tmp/icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          sed -i 's/@drawable\/ic_launcher/@mipmap\/ic_launcher/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/@drawable\/ic_launcher_round/@mipmap\/ic_launcher_round/g' app/src/main/AndroidManifest.xml || true
          rm -f app/src/main/res/drawable/ic_launcher.png app/src/main/res/drawable/ic_launcher.xml "app/src/main/res/drawable/ic_launcher (1).png" || true
          git config user.name "violet"
          git config user.email "violet@users.noreply.github.com"
          git add -A
          git commit -m "Add PijatIN gold lotus icon 192px #96" || true
          git push
