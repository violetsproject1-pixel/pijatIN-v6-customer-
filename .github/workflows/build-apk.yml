name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check gradlew size
        run: |
          ls -lh gradlew gradlew.bat || true
          wc -c gradlew || echo "no gradlew"
          if [ $(wc -c < gradlew) -lt 100 ]; then
            echo "CORRUPTED! Need restore"
          fi

      - name: Restore gradlew via Gradle official
        if: always()
        run: |
          # Download gradle and generate wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.7/bin:$PATH
          gradle --version
          # Backup corrupted files
          rm -f gradlew gradlew.bat
          # Generate new wrapper
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ls -lh gradlew gradlew.bat
          head -20 gradlew

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build APK REAL 4m
        run: |
          ./gradlew app:assembleDebug --stacktrace

      - name: Find APKs
        if: always()
        run: |
          find . -name "*.apk" -type f -exec ls -lh {} \; || true
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PijatIN-GOLD-APK-109-FINAL
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
