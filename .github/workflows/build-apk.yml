name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable + show project
        run: |
          chmod +x gradlew
          ls -la
          ls -la app/src/main/res/mipmap-xxxhdpi/ || true
          echo "SDK: $ANDROID_HOME"
          ./gradlew --version

      - name: Clean bad icons only
        run: |
          rm -f app/src/main/res/drawable/ic_launcher.png || true
          rm -f "app/src/main/res/drawable/ic_launcher (1).png" || true
          rm -rf app/src/main/res/mipmap-anydpi-v26 || true

      - name: Build APK (will take 2-3 minutes)
        run: |
          ./gradlew app:assembleDebug --stacktrace --no-daemon --info | tail -n 200
          echo "BUILD DONE"

      - name: Find APKs
        if: always()
        run: |
          echo "Searching APKs..."
          find . -name "*.apk" -type f
          ls -R app/build/outputs/ || true

      - name: Upload GOLD APK FINAL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PijatIN-GOLD-APK-104-FINAL
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
