name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix icon (1) bug - SUPER ROBUST
        run: |
          echo "FIND ALL BAD ICONS"
          find app/src/main/res -name "*ic_launcher*" -type f || true
          echo "--- MANIFEST BEFORE ---"
          cat app/src/main/AndroidManifest.xml | head -20
          # 1. Rename all files with (1) (2) etc to clean name
          find app/src/main/res -type f -name "*(*)*" | while read f; do
            clean=$(echo "$f" | sed 's/(1)//g; s/(2)//g; s/(3)//g; s/ //g')
            echo "Fix $f -> $clean"
            mv "$f" "$clean" 2>/dev/null || mv "$f" "$(dirname $f)/$(basename $f | tr -d '()1 2 3')" || true
          done
          # 2. Fix Manifest if it references (1)
          sed -i 's/ic_launcher(1)/ic_launcher/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/ic_launcher_round(1)/ic_launcher_round/g' app/src/main/AndroidManifest.xml || true
          echo "--- MANIFEST AFTER ---"
          cat app/src/main/AndroidManifest.xml | head -20
          echo "--- ICONS AFTER ---"
          find app/src/main/res -name "*ic_launcher*" -type f
          # 3. Restore gradlew 3 files
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -rf gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradlew -o gradlew
          curl -sL https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
          echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Local props
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build APK
        run: ./gradlew app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PijatIN-GOLD-APK-118-FIXED
          path: app/build/outputs/apk/debug/*.apk
